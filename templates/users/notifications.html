{% extends "base.html" %}

{% block title %}Notifications{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 760px">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Notifications</h1>
        {% if unread_notifications %}
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-outline-secondary">Mark all as read</button>
        </form>
        {% endif %}
    </div>

    <div class="list-group">
        {% for note in notifications %}
        <form method="post" action="{% url 'users:open_notification' note.id %}" class="list-group-item p-0">
            {% csrf_token %}
            <button type="submit" class="btn w-100 text-start p-3 {% if not note.read_at %}fw-semibold{% endif %}">
                <div class="d-flex justify-content-between gap-2">
                    <span>{% if not note.read_at %}<span class="badge text-bg-primary me-2">new</span>{% endif %}{{ note.title }}</span>
                    <small class="text-muted text-nowrap">{{ note.created_at|timesince }} ago</small>
                </div>
                {% if note.body %}<div class="small text-muted fw-normal mt-1">{{ note.body }}</div>{% endif %}
            </button>
        </form>
        {% empty %}
        <div class="list-group-item text-muted">You're all caught up.</div>
        {% endfor %}
    </div>
</div>
{% endblock %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ExcelPoint</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#2563EB" />
    <!-- Link previews (WhatsApp, iMessage, X, LinkedIn). The server swaps __SITE_URL__ for this site's address. -->
    <meta name="description" content="Upload notes or lectures. Get flashcards, quizzes and summaries, and answers from XP, your AI study assistant. Free in beta." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ExcelPoint" />
    <meta property="og:title" content="ExcelPoint · Learn faster from your own notes" />
    <meta property="og:description" content="Upload notes or lectures. Get flashcards, quizzes and summaries, and answers from XP, your AI study assistant. Free in beta." />
    <meta property="og:image" content="__SITE_URL__/static/app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ExcelPoint: the 3D E logo and the line Learn faster from your own notes" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SITE_URL__/static/app/og-image.jpg" />
    <!-- Inter is served from our own server: no third-party request before text shows, and no visitor IPs sent to Google -->
    <script>
      // Apply the saved theme before first paint so dark mode never flashes white.
      (function () {
        var t
        try { t = localStorage.getItem('xp-theme') } catch (e) {}
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <style>
      /* Shown until the app has loaded (seconds on a slow phone connection); React replaces it. */
      body { margin: 0; background: #f8fafc; }
      [data-theme='dark'] body { background: #0f172a; }
      [data-theme='dark'] .boot { color: #94a3b8; }
      .boot { display: grid; min-height: 100vh; place-content: center; justify-items: center; gap: 14px;
        font: 500 15px/1.4 Inter, system-ui, sans-serif; color: #64748b; }
      .boot img { width: 44px; height: 44px; border-radius: 10px; animation: boot 1.2s ease-in-out infinite; }
      @keyframes boot { 50% { opacity: .55; } }
      @media (prefers-reduced-motion: reduce) { .boot img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status"><img src="/favicon.png" alt="" width="44" height="44" />Loading ExcelPoint…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
